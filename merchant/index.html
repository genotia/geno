<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Genoti for Merchants</title>
<link rel="canonical" href="ai-agents.html">
<script>
  /* /merchant/ lands on the AI Agents page by default. A Supabase
     password-recovery link still points at /merchant/index.html, so if this
     URL carries a recovery token, forward it (token intact) to the login page
     where the set-password form lives — no auth config change needed. */
  (function () {
    var s = location.search, h = location.hash;
    var recovery = /type=recovery/.test(h) || /[?&](code|token_hash)=/.test(s);
    location.replace((recovery ? 'login.html' : 'ai-agents.html') + s + h);
  })();
</script>
<meta http-equiv="refresh" content="0; url=ai-agents.html">
</head>
<body style="font-family:system-ui,-apple-system,sans-serif;padding:32px;color:#2a2840">

</body>
</html>
