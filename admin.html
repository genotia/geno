<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin · Genoti</title>
<style>
  :root {
    --green: #1D9E75; --dark-green: #085041; --text: #111827; --muted: #6B7280;
    --border: #E5E7EB; --bg: #F9FAFB; --white: #fff; --red: #EF4444;
    --purple: #6D28D9; --purple-bg: #F5F3FF; --amber: #B45309; --amber-bg: #FFFBEB;
    --blue: #1D4ED8; --blue-bg: #EFF6FF; --green-lt: #ECFDF5; --green-md: #A7F3D0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

  header { background: var(--white); border-bottom: 1px solid var(--border); padding: 16px 24px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .brand { font-size: 18px; font-weight: 800; letter-spacing: -.5px; display: flex; align-items: center; gap: 10px; }
  .brand span { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .6px;
    background: var(--purple-bg); color: var(--purple); padding: 3px 8px; border-radius: 20px; }
  .who { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 12px; }
  .who button { background: none; border: 1px solid var(--border); border-radius: 20px; padding: 6px 13px;
    font-family: inherit; font-size: 12px; font-weight: 700; color: var(--muted); cursor: pointer; }
  .who button:hover { border-color: var(--red); color: var(--red); }

  main { max-width: 1180px; margin: 0 auto; padding: 24px 20px 60px; }
  .state { background: var(--white); border: 1px solid var(--border); border-radius: 16px;
    padding: 40px 28px; text-align: center; max-width: 460px; margin: 60px auto; }
  .state h2 { margin: 0 0 8px; font-size: 18px; letter-spacing: -.4px; }
  .state p { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.6; }
  .state a { color: var(--green); font-weight: 700; }

  h2.sec { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .7px;
    color: var(--muted); margin: 30px 0 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .card { background: var(--white); border: 1px solid var(--border); border-radius: 14px; padding: 16px 17px; }
  .k { font-size: 11.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .v { font-size: 27px; font-weight: 800; letter-spacing: -1px; margin-top: 6px; }
  .sub { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
  .card.live .v { color: var(--green); }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--green);
    margin-right: 5px; vertical-align: 1px; animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }

  table { width: 100%; border-collapse: collapse; background: var(--white);
    border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  .tw { overflow-x: auto; }
  th { text-align: left; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px;
    color: var(--muted); padding: 11px 15px; background: var(--bg); border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 11px 15px; font-size: 13.5px; border-bottom: 1px solid var(--border); }
  tr:last-child td { border-bottom: none; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
  .bar { height: 6px; border-radius: 4px; background: var(--green); min-width: 3px; }
  .pill { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .4px;
    padding: 3px 8px; border-radius: 20px; }
  .pill.pending  { background: var(--amber-bg); color: var(--amber); }
  .pill.approved { background: var(--green-lt); color: var(--green); }
  .pill.rejected { background: #FEF2F2; color: var(--red); }
  .empty { padding: 22px 16px; text-align: center; font-size: 13px; color: var(--muted); }
  .note { background: var(--amber-bg); border: 1px solid #FDE68A; color: var(--amber);
    border-radius: 12px; padding: 12px 15px; font-size: 12.5px; line-height: 1.6; margin-bottom: 18px; }
  .note code { background: rgba(0,0,0,.05); padding: 1px 5px; border-radius: 4px; font-size: 11.5px; }
  .acts { display: flex; gap: 6px; }
  .act { font-family: inherit; font-size: 11.5px; font-weight: 700; padding: 6px 11px; border-radius: 20px;
    border: 1.5px solid var(--border); background: var(--white); color: var(--muted); cursor: pointer; white-space: nowrap; }
  .act.ok:hover  { border-color: var(--green); color: var(--green); background: var(--green-lt); }
  .act.no:hover  { border-color: var(--red); color: var(--red); background: #FEF2F2; }
  .act.solid.ok  { background: var(--green); border-color: var(--green); color: #fff; }
  .act.solid.no  { background: var(--red); border-color: var(--red); color: #fff; }
  .act.solid:hover { opacity: .9; }
  .act.ghost:hover { border-color: var(--muted); color: var(--text); }
  #confirm { position: fixed; inset: 0; background: rgba(17,24,39,.55); display: none;
    align-items: center; justify-content: center; padding: 20px; z-index: 900; }
  #confirm.open { display: flex; }
  .cbox { background: var(--white); border-radius: 18px; max-width: 420px; width: 100%; padding: 24px; }
  .ctitle { font-size: 17px; font-weight: 800; letter-spacing: -.4px; margin-bottom: 10px; }
  .cbody { font-size: 13.5px; color: var(--muted); line-height: 1.6; }
  .cwarn { margin-top: 12px; background: var(--amber-bg); border: 1px solid #FDE68A; color: var(--amber);
    border-radius: 10px; padding: 9px 12px; font-size: 12px; font-weight: 700; }
  .cacts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
  #refresh-hint { display: none; background: var(--blue-bg); border: 1px solid #BFDBFE; color: var(--blue);
    border-radius: 12px; padding: 11px 15px; font-size: 12.5px; margin-bottom: 16px; }
</style>
</head>
<body>

<header>
  <div class="brand">Genoti <span>Admin</span></div>
  <div class="who" id="who"></div>
</header>

<main>
  <div id="gate" class="state">
    <h2>Checking access…</h2>
    <p>One moment.</p>
  </div>
  <div id="refresh-hint">Review opened in a new tab. Come back here and the list refreshes automatically.</div>
  <div id="panel" style="display:none"></div>
</main>
<div id="confirm" onclick="if(event.target===this)closeConfirm()"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="auth.js"></script>
<script>
const G = window.GenotiAuth;
const sb = G.sb;

const fmt = n => Number(n || 0).toLocaleString('en-IN');
const card = (k, v, sub, cls) =>
  `<div class="card ${cls || ''}"><div class="k">${k}</div><div class="v">${v}</div>${sub ? `<div class="sub">${sub}</div>` : ''}</div>`;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function state(title, body) {
  document.getElementById('panel').style.display = 'none';
  const g = document.getElementById('gate');
  g.style.display = '';
  g.innerHTML = `<h2>${title}</h2><p>${body}</p>`;
}

/* ── Access: logged in AND on the admins table. The table is the real
      gate — RLS refuses the reads regardless of what this page thinks. ── */
async function boot() {
  const user = await G.ready;

  if (!user) {
    state('Admin access', 'You need to log in with an admin account. ' +
      '<br><br><a href="#" onclick="G.open({icon:\'lock\',title:\'Admin login\',msg:\'Log in with your admin account to open the dashboard.\'});return false">Log in</a>');
    G.onChange(u => { if (u) location.reload(); });
    return;
  }

  document.getElementById('who').innerHTML =
    `${esc(user.email)} <button onclick="openSetPw()">Set password</button> <button onclick="G.signOut().then(()=>location.reload())">Log out</button>`;

  const { data, error } = await sb.from('admins').select('email').limit(1);
  if (error || !data || !data.length) {
    state('Not an admin', `<b>${esc(user.email)}</b> is not on the admin list, so this dashboard is not available. ` +
      'If that is wrong, add the address to the <code>admins</code> table.');
    return;
  }
  render();
}

/* ── Reviewing an application ─────────────────────────────────────────── */
const FN_URL = 'https://ijsxmgkzwvamwctbkgjo.supabase.co/functions/v1/review-merchant-application';
let APPS = [];

function reviewUrl(a, action) {
  return `${FN_URL}?id=${encodeURIComponent(a.id)}&token=${encodeURIComponent(a.approval_token || '')}&action=${action}`;
}

/* Approving creates a real account and emails a set-password link, so both
   actions are confirmed first and neither can be undone from here. */
function askReview(id, action) {
  const a = APPS.find(x => String(x.id) === String(id));
  if (!a) return;
  const approve = action === 'approve';
  document.getElementById('confirm').innerHTML = `
    <div class="cbox">
      <div class="ctitle">${approve ? 'Approve' : 'Reject'} ${esc(a.business_name)}?</div>
      <div class="cbody">
        ${approve
          ? `This creates an account for <b>${esc(a.email)}</b> and emails them a link to set a password. They get access to the merchant dashboard straight away.`
          : `This marks the request rejected and no account is created. <b>${esc(a.email)}</b> is not emailed, so follow up yourself if you want to.`}
        <div class="cwarn">This cannot be undone from this panel.</div>
      </div>
      <div class="cacts">
        <button class="act ghost" onclick="closeConfirm()">Cancel</button>
        <button class="act ${approve ? 'ok' : 'no'} solid" onclick="doReview('${esc(a.id)}','${action}')">
          ${approve ? 'Approve and create account' : 'Reject request'}
        </button>
      </div>
    </div>`;
  document.getElementById('confirm').classList.add('open');
}

function closeConfirm() { document.getElementById('confirm').classList.remove('open'); }

/* One-click merchant approval via the approve-merchant edge function (which
   verifies this caller is an admin, then sets the approval flag). */
async function approveMerchant() {
  const email = (document.getElementById('ap-email').value || '').trim();
  const btn = document.getElementById('ap-btn');
  const msg = document.getElementById('ap-msg');
  const show = (text, ok) => { msg.textContent = text; msg.style.display = 'block';
    msg.style.background = ok ? 'var(--green-lt)' : '#FEF2F2';
    msg.style.color = ok ? '#065F46' : '#B91C1C'; };
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return show('Enter a valid merchant email.', false);

  btn.disabled = true; btn.textContent = 'Approving…';
  const { data, error } = await sb.functions.invoke('approve-merchant', { body: { email } });
  btn.disabled = false; btn.textContent = 'Approve';

  if (error || (data && data.error)) {
    let m = (data && data.error) || error.message || 'Could not approve.';
    // supabase-js wraps non-2xx as a generic error; surface the function body when present.
    if (error && error.context && typeof error.context.json === 'function') {
      try { const b = await error.context.json(); if (b && b.error) m = b.error; } catch (e) {}
    }
    return show(m, false);
  }
  show(`Approved ${email}. Ask them to log out and back in.`, true);
  document.getElementById('ap-email').value = '';
}

/* Let the admin set (or change) a password so they can sign in without an
   email code next time. Uses the current session — no re-auth needed. */
function openSetPw() {
  document.getElementById('confirm').innerHTML = `
    <div class="cbox">
      <div class="ctitle">Set a password</div>
      <div class="cbody">Choose a password so you can sign in with email + password next time, instead of a one-time code.</div>
      <div id="pw-msg" style="display:none;font-size:12.5px;margin-top:12px;padding:9px 12px;border-radius:10px;"></div>
      <input id="admin-pw"  type="password" placeholder="New password (min 8)" autocomplete="new-password"
        style="width:100%;margin-top:14px;padding:11px 13px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;font-family:inherit;outline:none;box-sizing:border-box;">
      <input id="admin-pw2" type="password" placeholder="Confirm password" autocomplete="new-password"
        style="width:100%;margin-top:10px;padding:11px 13px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;font-family:inherit;outline:none;box-sizing:border-box;">
      <div class="cacts">
        <button class="act ghost" onclick="closeConfirm()">Cancel</button>
        <button class="act ok solid" id="admin-pw-save" onclick="saveAdminPw()">Save password</button>
      </div>
    </div>`;
  document.getElementById('confirm').classList.add('open');
  setTimeout(() => document.getElementById('admin-pw').focus(), 60);
}

async function saveAdminPw() {
  const pw  = document.getElementById('admin-pw').value;
  const pw2 = document.getElementById('admin-pw2').value;
  const msg = document.getElementById('pw-msg');
  const show = (text, ok) => { msg.textContent = text; msg.style.display = 'block';
    msg.style.background = ok ? 'var(--green-lt)' : '#FEF2F2';
    msg.style.color = ok ? '#065F46' : '#B91C1C'; };
  if (pw.length < 8) return show('Password must be at least 8 characters.', false);
  if (pw !== pw2)    return show('Passwords do not match.', false);

  const btn = document.getElementById('admin-pw-save');
  btn.disabled = true; btn.textContent = 'Saving…';
  const { error } = await sb.auth.updateUser({ password: pw });
  btn.disabled = false; btn.textContent = 'Save password';
  if (error) return show(error.message || 'Could not set the password.', false);

  // Tell the shared login modal this email now has a password, so next time it
  // offers the password screen straight away instead of the email-code flow.
  try {
    const email = (G.user() && G.user().email) || '';
    const list = JSON.parse(localStorage.getItem('genoti_pw_emails') || '[]');
    if (email && !list.includes(email)) { list.push(email); localStorage.setItem('genoti_pw_emails', JSON.stringify(list)); }
    if (email) localStorage.setItem('genoti_last_email', email);
  } catch (e) {}
  show('Password set. You can now sign in with your email and this password.', true);
  setTimeout(closeConfirm, 1600);
}

function doReview(id, action) {
  const a = APPS.find(x => String(x.id) === String(id));
  closeConfirm();
  if (!a) return;
  // The function replies with its own HTML result page, so open it directly.
  window.open(reviewUrl(a, action), '_blank', 'noopener');
  document.getElementById('refresh-hint').style.display = '';
}

/* Coming back from that tab, pull fresh statuses. */
window.addEventListener('focus', () => {
  const hint = document.getElementById('refresh-hint');
  if (hint && hint.style.display !== 'none') { hint.style.display = 'none'; render(); }
});

/* ── Data ─────────────────────────────────────────────────────────────── */
const since = d => new Date(Date.now() - d * 864e5).toISOString();

async function countOf(table, build) {
  let q = sb.from(table).select('*', { count: 'exact', head: true });
  if (build) q = build(q);
  const { count, error } = await q;
  return error ? null : (count || 0);
}

/* ── Control plane: platform-wide view of merchants, plans, modules, usage.
   Fed by the admin-metrics edge function (cross-tenant, service role). ── */
function controlPlaneHTML(cp, why) {
  if (!cp) {
    return `<div class="note"><b>Control plane not connected yet.</b>
      Apply <code>supabase/migrations/20260726100000_control_plane.sql</code> and deploy the
      <code>admin-metrics</code> function to see plans, modules, usage and MRR.
      ${why ? `<br><br><b>Reason:</b> <code>${esc(why)}</code>` : ''}</div>`;
  }
  const k = cp.kpis || {};
  const inr = n => '₹' + fmt(n || 0);
  const plansByKey = Object.fromEntries((cp.plans || []).map(p => [p.key, p]));
  const maxRank = Math.max(1, ...(cp.plans || []).map(p => p.rank || 1));

  // ── Overview ──
  const overview = `
    <h2 class="sec">Platform</h2>
    <div class="grid">
      ${card('MRR', inr(k.mrr), 'from active subscriptions', 'live')}
      ${card('Merchants', fmt(k.merchants), `${fmt(k.active)} active · ${fmt(k.trialing)} trialing`)}
      ${card('ARR (run-rate)', inr((k.mrr || 0) * 12), 'MRR × 12')}
      ${card('Avg revenue / merchant', inr(k.active ? Math.round((k.mrr||0)/k.active) : 0), 'active only')}
    </div>`;

  // ── Merchants directory ──
  const catPill = c => c ? `<span class="pill" style="background:var(--purple-bg);color:var(--purple)">${esc(c)}</span>` : '—';
  const statusPill = st => {
    const map = { active:['var(--green-lt)','var(--green)'], trial:['var(--blue-bg)','var(--blue)'],
      past_due:['var(--amber-bg)','var(--amber)'], cancelled:['#FEF2F2','var(--red)'], none:['var(--bg)','var(--muted)'] };
    const [bg,fg] = map[st] || map.none;
    return `<span class="pill" style="background:${bg};color:${fg}">${esc(st)}</span>`;
  };
  const when = d => d ? new Date(d).toLocaleDateString('en-IN', { day:'numeric', month:'short' }) : '—';
  const rowsSorted = (cp.merchants || []).slice().sort((a,b) => (b.usage.bookings - a.usage.bookings));
  const directory = `
    <h2 class="sec">Merchants</h2>
    <div class="tw"><table><thead><tr>
      <th>Business</th><th>Category</th><th>Plan</th><th>Status</th>
      <th class="num">Bookings</th><th class="num">Clients</th><th class="num">Staff</th><th class="num">Services</th>
      <th>Last active</th><th></th>
    </tr></thead><tbody>
      ${rowsSorted.map(m => `<tr>
        <td><b>${esc(m.name)}</b></td>
        <td>${catPill(m.category)}</td>
        <td>${esc(m.plan_name || '—')}${m.price_monthly ? `<div class="sub">${inr(m.price_monthly)}/mo</div>` : ''}</td>
        <td>${statusPill(m.status)}</td>
        <td class="num">${fmt(m.usage.bookings)}</td>
        <td class="num">${fmt(m.usage.clients)}</td>
        <td class="num">${fmt(m.usage.staff)}</td>
        <td class="num">${fmt(m.usage.services)}</td>
        <td>${when(m.last_active)}</td>
        <td><a class="act ok" href="merchant/dashboard.html" target="_blank" rel="noopener" title="Open workspace (needs your account linked)">Open</a></td>
      </tr>`).join('') || '<tr><td colspan="10" class="empty">No merchants yet.</td></tr>'}
    </tbody></table></div>`;

  // ── Modules & Plans matrix ──
  const plansOrdered = (cp.plans || []).slice().sort((a,b) => a.rank - b.rank);
  const modsOrdered  = (cp.modules || []).slice().sort((a,b) => a.sort - b.sort);
  const planHead = plansOrdered.map(p =>
    `<th class="num">${esc(p.name)}<div class="sub" style="font-weight:600">${p.price_monthly ? inr(p.price_monthly)+'/mo' : 'Free'}</div></th>`).join('');
  const modRows = modsOrdered.map(mod => `<tr>
      <td><b>${esc(mod.name)}</b>${mod.grp ? `<div class="sub">${esc(mod.grp)}</div>` : ''}</td>
      ${plansOrdered.map(p => `<td class="num">${(p.rank >= mod.min_plan_rank)
        ? '<span style="color:var(--green);font-weight:800">✓</span>'
        : '<span style="color:var(--border)">–</span>'}</td>`).join('')}
    </tr>`).join('');
  const modules = `
    <h2 class="sec">Modules &amp; Plans</h2>
    <div class="tw"><table><thead><tr><th>Module</th>${planHead}</tr></thead>
      <tbody>${modRows}</tbody></table></div>`;

  // ── Usage & adoption ──
  const adoptionRows = Object.entries(k.adoption || {})
    .sort((a,b) => b[1]-a[1])
    .map(([mod, n]) => {
      const pct = k.merchants ? Math.round(n / k.merchants * 100) : 0;
      return `<tr><td>${esc(mod)}</td><td class="num">${fmt(n)} / ${fmt(k.merchants)}</td>
        <td style="width:40%"><div class="bar" style="width:${pct}%"></div></td>
        <td class="num">${pct}%</td></tr>`;
    }).join('');
  const usage = `
    <h2 class="sec">Module adoption</h2>
    <div class="sub" style="margin:-6px 0 12px">Merchants with real data in each module (live counts).</div>
    <div class="tw"><table><thead><tr><th>Module</th><th class="num">Merchants using</th><th></th><th class="num">Adoption</th></tr></thead>
      <tbody>${adoptionRows || '<tr><td colspan="4" class="empty">No usage yet.</td></tr>'}</tbody></table></div>`;

  return overview + directory + modules + usage;
}

async function render() {
  document.getElementById('gate').style.display = 'none';
  const p = document.getElementById('panel');
  p.style.display = '';
  p.innerHTML = '<div class="empty">Loading…</div>';

  const [
    viewsAll, views1, views7,
    events30m, eventRows,
    deals, merchants, bookings, apps,
    cpResp,
  ] = await Promise.all([
    countOf('events', q => q.eq('name', 'page_view')),
    countOf('events', q => q.eq('name', 'page_view').gte('created_at', since(1))),
    countOf('events', q => q.eq('name', 'page_view').gte('created_at', since(7))),
    sb.from('events').select('session_id').gte('created_at', new Date(Date.now() - 30 * 60000).toISOString()),
    sb.from('events').select('name, visitor_id, user_id, path, created_at').gte('created_at', since(30)).limit(5000),
    sb.from('deals').select('category, active, merchant_name'),
    sb.from('merchants').select('id, name, category, listed, created_at'),
    sb.from('bookings').select('id, merchant_name, status, customer_email, created_at'),
    sb.from('merchant_applications').select('id, full_name, business_name, category, email, phone, address, num_branches, num_staff, plan, status, approval_token, created_at, reviewed_at'),
    sb.functions.invoke('admin-metrics'),
  ]);
  const cp = (cpResp && !cpResp.error && cpResp.data && !cpResp.data.error) ? cpResp.data : null;
  // Surface why the control-plane call failed so it's diagnosable at a glance.
  let cpWhy = '';
  if (!cp) {
    if (cpResp && cpResp.data && cpResp.data.error) cpWhy = cpResp.data.error;
    else if (cpResp && cpResp.error) {
      cpWhy = cpResp.error.message || 'Function call failed';
      // supabase-js hides the function's own message inside a non-2xx context.
      if (cpResp.error.context && typeof cpResp.error.context.json === 'function') {
        try { const b = await cpResp.error.context.json(); if (b && b.error) cpWhy = b.error; } catch (e) {}
      } else if (/Failed to send a request|Failed to fetch/i.test(cpWhy)) {
        cpWhy = 'The admin-metrics function is not deployed (or unreachable). Run: supabase functions deploy admin-metrics';
      }
    }
  }

  const evs   = eventRows.data || [];
  const dl    = deals.data || [];
  const mch   = merchants.data || [];
  const bk    = bookings.data || [];
  const ap    = apps.data || [];
  APPS = ap;

  const uniq = (arr, k) => new Set(arr.map(r => r[k]).filter(Boolean)).size;
  const visitors30 = uniq(evs, 'visitor_id');
  const signedIn30 = uniq(evs, 'user_id');
  const liveNow    = uniq(events30m.data || [], 'session_id');
  const bkToday    = bk.filter(b => new Date(b.created_at) >= new Date(since(1))).length;
  const bookers    = uniq(bk, 'customer_email');
  const bkPending  = bk.filter(b => b.status === 'pending').length;

  const missing = [deals, merchants, bookings, apps, eventRows]
    .filter(r => r.error).map(r => r.error.message);

  const notTracked = viewsAll === null;

  /* group helper */
  const group = (rows, key) => {
    const m = {};
    rows.forEach(r => { const k = r[key] || 'Uncategorised'; m[k] = (m[k] || 0) + 1; });
    return Object.entries(m).sort((a, b) => b[1] - a[1]);
  };

  const dealsByCat = group(dl.filter(d => d.active !== false), 'category');
  const mchByCat   = group(mch, 'category');
  const bkByMerch  = group(bk, 'merchant_name');
  const pagesByViews = group(evs.filter(e => e.name === 'page_view'), 'path');

  const barTable = (rows, label, valLabel) => {
    if (!rows.length) return `<div class="empty">Nothing yet.</div>`;
    const max = Math.max(...rows.map(r => r[1]));
    return `<div class="tw"><table><thead><tr><th>${label}</th><th class="num">${valLabel}</th><th style="width:34%"></th></tr></thead><tbody>
      ${rows.map(([k, v]) => `<tr><td>${esc(k)}</td><td class="num">${fmt(v)}</td>
        <td><div class="bar" style="width:${Math.round(v / max * 100)}%"></div></td></tr>`).join('')}
    </tbody></table></div>`;
  };

  /* Who is actually waiting. Pending first, then most recent. */
  const applicantsTable = rows => {
    if (!rows.length) return '<div class="empty">No applications yet.</div>';
    const rank = { pending: 0, approved: 1, rejected: 2 };
    const sorted = rows.slice().sort((a, b) =>
      (rank[a.status] ?? 9) - (rank[b.status] ?? 9) ||
      new Date(b.created_at) - new Date(a.created_at));
    const when = d => d ? new Date(d).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : '—';
    return `<div class="tw"><table><thead><tr>
        <th>Status</th><th>Business</th><th>Category</th><th>Contact</th><th>Email</th><th>Phone</th>
        <th class="num">Branches</th><th class="num">Staff</th><th>Plan</th><th>Requested</th><th>Review</th>
      </tr></thead><tbody>
      ${sorted.map(a => `<tr>
        <td><span class="pill ${esc(a.status)}">${esc(a.status)}</span></td>
        <td><b>${esc(a.business_name || '—')}</b>${a.address ? `<div class="sub">${esc(a.address)}</div>` : ''}</td>
        <td>${a.category ? `<span class="pill" style="background:var(--purple-bg);color:var(--purple)">${esc(a.category)}</span>` : '—'}</td>
        <td>${esc(a.full_name || '—')}</td>
        <td><a href="mailto:${esc(a.email)}">${esc(a.email || '—')}</a></td>
        <td>${esc(a.phone || '—')}</td>
        <td class="num">${esc(a.num_branches ?? '—')}</td>
        <td class="num">${esc(a.num_staff ?? '—')}</td>
        <td>${esc(a.plan || '—')}</td>
        <td>${esc(when(a.created_at))}</td>
        <td>${a.status === 'pending'
          ? `<div class="acts">
               <button class="act ok" onclick="askReview('${esc(a.id)}','approve')">Approve</button>
               <button class="act no" onclick="askReview('${esc(a.id)}','reject')">Reject</button>
             </div>`
          : `<span class="sub">${esc(when(a.reviewed_at))}</span>`}</td>
      </tr>`).join('')}
    </tbody></table></div>`;
  };


  p.innerHTML = `
    ${notTracked ? `<div class="note"><b>The events table is not there yet.</b>
      Traffic numbers stay at zero until you apply <code>supabase/migrations/20260722000000_analytics.sql</code>.
      Everything below it reads live data.</div>` : ''}
    ${missing.length ? `<div class="note"><b>Some reads were refused:</b> ${esc(missing.join(' · '))}</div>` : ''}
    ${controlPlaneHTML(cp, cpWhy)}

    <h2 class="sec">Audience</h2>
    <div class="grid">
      ${card('Viewing now', `<span class="dot"></span>${fmt(liveNow)}`, 'active sessions, last 30 min', 'live')}
      ${card('Page views', fmt(viewsAll), 'all time')}
      ${card('Views today', fmt(views1), 'last 24 hours')}
      ${card('Views this week', fmt(views7), 'last 7 days')}
      ${card('Unique visitors', fmt(visitors30), 'last 30 days')}
      ${card('Signed-in users', fmt(signedIn30), 'active, last 30 days')}
    </div>

    <h2 class="sec">Deals</h2>
    <div class="grid">
      ${card('Live deals', fmt(dl.filter(d => d.active !== false).length), `${fmt(dl.length)} total incl. inactive`)}
      ${card('Categories', fmt(dealsByCat.length), 'with at least one live deal')}
    </div>
    <div style="margin-top:12px">${barTable(dealsByCat, 'Deals by category', 'Deals')}</div>

    <h2 class="sec">Bookings</h2>
    <div class="grid">
      ${card('Total bookings', fmt(bk.length), 'all time')}
      ${card('Booked today', fmt(bkToday), 'last 24 hours')}
      ${card('Customers booking', fmt(bookers), 'unique accounts')}
      ${card('Awaiting confirmation', fmt(bkPending), 'status: pending')}
      ${card('View → booking', viewsAll ? (bk.length / viewsAll * 100).toFixed(1) + '%' : '—', 'bookings per page view')}
    </div>
    <div style="margin-top:12px">${barTable(bkByMerch, 'Bookings by merchant', 'Bookings')}</div>

    <h2 class="sec">Merchants</h2>
    <div class="card" style="margin-bottom:12px">
      <div class="k">Approve a merchant account</div>
      <div class="sub" style="margin:4px 0 10px">Grants dashboard access to an existing merchant email (sets the approval flag). They log in again to pick it up.</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <input id="ap-email" type="email" placeholder="merchant@example.com" autocomplete="off"
          style="flex:1;min-width:200px;padding:9px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:13.5px;font-family:inherit;outline:none;">
        <button class="act ok solid" id="ap-btn" onclick="approveMerchant()">Approve</button>
      </div>
      <div id="ap-msg" style="display:none;font-size:12.5px;margin-top:10px;padding:9px 12px;border-radius:10px;"></div>
    </div>
    <div class="card" style="margin-bottom:12px">
      <div class="k">Salon / Spa Merchant OS</div>
      <div class="sub" style="margin:4px 0 10px">Open the full salon/spa module set (Services, Bookings, Staff, Clients, Loyalty, Inventory, Marketing…) in the Merchant OS. Your admin account must be linked to a workspace to load it — see the grant SQL if it says "not linked".</div>
      <a class="act ok solid" href="merchant/dashboard.html" target="_blank" rel="noopener" style="text-decoration:none;display:inline-block">Open the Merchant OS →</a>
    </div>
    <div class="grid">
      ${card('Onboarded', fmt(mch.length), 'in the merchants table')}
      ${card('Listed live', fmt(mch.filter(m => m.listed).length), 'visible to customers')}
      ${card('Applications', fmt(ap.length), 'requests to join')}
      ${card('Awaiting approval', fmt(ap.filter(a => a.status === 'pending').length), 'need your decision')}
      ${card('Merchants with bookings', fmt(bkByMerch.length), 'have taken at least one')}
    </div>
    <div style="margin-top:12px">${barTable(mchByCat, 'Merchants by category', 'Merchants')}</div>
    <div style="margin-top:12px">${applicantsTable(ap)}</div>

    <h2 class="sec">Traffic by page</h2>
    ${barTable(pagesByViews, 'Page', 'Views (30d)')}
  `;
}

boot();
</script>
</body>
</html>
