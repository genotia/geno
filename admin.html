<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Genoti Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* new shell palette */
  --ink:#17161c; --ink-soft:#232230;
  --surface:#ffffff; --brand:#5b4ae0; --brand-soft:#eeebfb;
  --border-strong:#d6d5ce;
  /* legacy tokens kept so every inline style in the JS keeps resolving */
  --green:#12855f; --dark-green:#085041; --green-lt:#e3f4ec; --green-md:#A7F3D0;
  --amber:#b5720f; --amber-bg:#fbf0da; --blue:#2c5cc5; --blue-bg:#eef4ff;
  --red:#c0392b; --red-soft:#fbe9e7; --purple:#5b4ae0; --purple-bg:#eeebfb;
  --grey:#6b6a75; --grey-soft:#efefec;
  --text:#1b1a22; --muted:#6b6a75; --text-muted:#6b6a75;
  --border:#e7e6e0; --bg:#f6f6f4; --white:#ffffff;
  --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.app{display:flex;min-height:100vh}

/* Sidebar */
.sidebar{width:230px;flex-shrink:0;background:var(--ink);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:9px;padding:18px 18px 4px}
.brand-mark{width:26px;height:26px;border-radius:7px;background:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.brand-name{font-weight:600;font-size:16px}
.plane{font-size:11px;color:#8a8998;padding:0 18px 14px 45px;letter-spacing:.03em}
.nav{flex:1;padding:6px 10px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;color:#c9c8d4;padding:9px 10px;border-radius:8px;font-size:13.5px;text-align:left}
.nav-item:hover{background:var(--ink-soft);color:#fff}
.nav-item.active{background:var(--brand);color:#fff;font-weight:500}
.nav-item svg{width:17px;height:17px;flex-shrink:0}
.nav-item .badge{margin-left:auto;font-size:11px;background:var(--amber);color:#fff;padding:1px 7px;border-radius:20px;font-weight:600}
.side-foot{padding:12px 16px;border-top:1px solid var(--ink-soft);display:flex;align-items:center;gap:10px}
.avatar{width:28px;height:28px;border-radius:50%;background:#38364a;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
.side-foot .who{font-size:12.5px;min-width:0}
.side-foot .who small{display:block;color:#8a8998;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}

/* Main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;padding:14px 26px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:20}
.topbar h1{font-size:18px;font-weight:600;letter-spacing:-0.01em}
.search{margin-left:auto;display:flex;align-items:center;gap:7px;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:7px 11px;width:240px}
.search input{border:none;background:none;font-size:13px;width:100%;color:var(--text)}
.search input:focus{outline:none}
.search svg{width:15px;height:15px;color:var(--text-muted)}
.top-btn{background:none;border:1px solid var(--border-strong);border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:500;color:var(--text)}
.top-btn:hover{border-color:var(--brand);color:var(--brand)}
.top-btn.danger:hover{border-color:var(--red);color:var(--red)}

.wrap{padding:22px 26px 60px;max-width:1240px;width:100%}
.view[hidden]{display:none}

/* Gate */
.state{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:44px 30px;text-align:center;max-width:460px;margin:60px auto}
.state h2{margin:0 0 8px;font-size:18px;letter-spacing:-.3px}
.state p{margin:0;font-size:14px;color:var(--muted);line-height:1.6}
.state a{color:var(--brand);font-weight:600}
.state code{background:var(--grey-soft);padding:1px 5px;border-radius:4px;font-size:12px}

/* Section heading */
h2.sec{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin:26px 0 12px}
h2.sec:first-child{margin-top:0}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:6px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:15px 16px}
.kpi .k-lab{font-size:12.5px;color:var(--text-muted);margin-bottom:7px}
.kpi .k-val{font-size:23px;font-weight:600;letter-spacing:-0.02em}
.kpi .k-sub{font-size:11.5px;color:var(--text-muted);margin-top:3px}
.kpi.brandval .k-val{color:var(--brand)}
.kpi.hot .k-val{color:var(--amber)}
.kpi .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:5px;vertical-align:1px;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}

/* legacy card (used by tool cards + some helpers) */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:15px 16px}
.card .k{font-size:11.5px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em}
.card .v{font-size:23px;font-weight:600;letter-spacing:-.02em;margin-top:6px}
.card .sub{font-size:11.5px;color:var(--text-muted);margin-top:3px}
.sub{font-size:11.5px;color:var(--text-muted)}

/* Attention band */
.attn{display:flex;align-items:center;gap:16px;background:var(--brand-soft);border:1px solid #ddd6f7;border-radius:12px;padding:14px 18px;margin-bottom:16px;flex-wrap:wrap}
.attn .a-ic{width:40px;height:40px;border-radius:11px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.attn .a-ic svg{width:20px;height:20px}
.attn .a-txt{flex:1;min-width:160px}
.attn .a-title{font-weight:600;font-size:14.5px;color:var(--brand)}
.attn .a-sub{font-size:12.5px;color:#5a4fb0}

/* Filters */
.filters{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--border);border-radius:9px;overflow:hidden;flex-wrap:wrap}
.seg button{border:none;background:none;padding:7px 13px;font-size:12.5px;color:var(--text-muted);text-transform:capitalize}
.seg button.on{background:var(--brand-soft);color:var(--brand);font-weight:500}
.filt-label{font-size:12px;color:var(--text-muted);margin-right:2px}
.spacer{flex:1}
.count-note{font-size:12.5px;color:var(--text-muted)}
.linky{color:var(--brand);cursor:pointer;font-size:12.5px;font-weight:500}

/* Panel + table */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:6px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:var(--surface)}
.panel table{border:none}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);font-weight:600;padding:11px 14px;border-bottom:1px solid var(--border);background:#fbfbfa;white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--border);font-size:13.5px;vertical-align:middle}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.rowlink{cursor:pointer}
tbody tr.rowlink:hover{background:#fafafa}
.m-name{font-weight:500}
.m-sub{font-size:12px;color:var(--text-muted)}
.bar{height:6px;border-radius:4px;background:var(--brand);min-width:3px}

/* tags / pills */
.cat-tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 9px;border-radius:20px;background:var(--grey-soft);color:var(--text);text-transform:capitalize}
.cat-salon{background:#eef4ff;color:#2c5cc5}
.cat-spa{background:#eefaf4;color:#12855f}
.cat-restaurant,.cat-buffet{background:#fff3ec;color:#c05a1e}
.cat-cafe{background:#fbf0da;color:#b5720f}
.cat-gym,.cat-fitness{background:#eeebfb;color:#5b4ae0}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:3px 9px;border-radius:20px}
.status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-active{background:var(--green-lt);color:var(--green)}
.s-trial{background:var(--blue-bg);color:var(--blue)}
.s-past_due{background:var(--amber-bg);color:var(--amber)}
.s-cancelled{background:var(--red-soft);color:var(--red)}
.s-none{background:var(--grey-soft);color:var(--grey)}
.s-pending{background:var(--amber-bg);color:var(--amber)}
.s-approved{background:var(--green-lt);color:var(--green)}
.s-rejected{background:var(--red-soft);color:var(--red)}
/* legacy .pill (applications table uses it) */
.pill{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:3px 8px;border-radius:20px}
.pill.pending{background:var(--amber-bg);color:var(--amber)}
.pill.approved{background:var(--green-lt);color:var(--green)}
.pill.rejected{background:var(--red-soft);color:var(--red)}

/* actions */
.acts{display:flex;gap:6px}
.row-actions{display:flex;gap:6px;justify-content:flex-end}
.act{font-family:inherit;font-size:12px;font-weight:500;padding:6px 12px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);cursor:pointer;white-space:nowrap}
.act:hover{border-color:var(--brand);color:var(--brand)}
.act.ok:hover{border-color:var(--green);color:var(--green)}
.act.no{color:var(--red);border-color:var(--red-soft)}
.act.no:hover{border-color:var(--red);color:var(--red)}
.act.solid{background:var(--brand);border-color:var(--brand);color:#fff}
.act.solid.ok{background:var(--green);border-color:var(--green);color:#fff}
.act.solid.no{background:var(--red);border-color:var(--red);color:#fff}
.act.solid:hover{filter:brightness(1.06);color:#fff}
.act.ghost{background:none}
.act.ghost:hover{border-color:var(--muted);color:var(--text)}
.icon-btn{border:1px solid var(--border);background:var(--surface);border-radius:7px;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;color:var(--text-muted)}
.icon-btn:hover{border-color:var(--brand);color:var(--brand)}
.icon-btn svg{width:15px;height:15px}

/* empty + note */
.empty{padding:40px 20px;text-align:center;color:var(--text-muted);font-size:13px}
.empty svg{width:32px;height:32px;opacity:.4;margin-bottom:10px}
.note{background:var(--amber-bg);border:1px solid #f2d79b;color:var(--amber);border-radius:12px;padding:12px 15px;font-size:12.5px;line-height:1.6;margin-bottom:16px}
.note code{background:rgba(0,0,0,.05);padding:1px 5px;border-radius:4px;font-size:11.5px}

/* tool card row */
.tools{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
@media(max-width:820px){.tools{grid-template-columns:1fr}}
.inp{width:100%;padding:9px 12px;border:1px solid var(--border-strong);border-radius:9px;font-size:13.5px;font-family:inherit;background:var(--surface);color:var(--text);outline:none}
.inp:focus{border-color:var(--brand)}

/* Plan editor + module matrix */
.plan-edit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:6px}
.pe-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;border-top:3px solid var(--border-strong)}
.pe-card.tier-r1{border-top-color:var(--grey)}
.pe-card.tier-r2{border-top-color:var(--green)}
.pe-card.tier-r3{border-top-color:var(--brand)}
.pe-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.pe-badge{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:3px 9px;border-radius:20px;background:var(--grey-soft);color:var(--text)}
.pe-card.tier-r2 .pe-badge{background:var(--green-lt);color:var(--green)}
.pe-card.tier-r3 .pe-badge{background:var(--brand-soft);color:var(--brand)}
.pe-price{font-size:26px;font-weight:600;letter-spacing:-.02em}
.pe-price span{font-size:13px;color:var(--text-muted);font-weight:500}
.pe-yr{font-size:11.5px;color:var(--green);margin-top:2px}
.pe-tag{font-size:12.5px;color:var(--text-muted);margin:8px 0 10px;line-height:1.5;min-height:34px}
.pe-meta{font-size:11.5px;color:var(--text-muted);border-top:1px solid var(--border);padding-top:9px}
.mtx-cell{cursor:pointer;user-select:none;color:var(--border-strong)}
.mtx-cell.inc{color:var(--green);font-weight:700}
.mtx-cell.min{background:var(--green-lt)}
.mtx-cell:hover{background:var(--brand-soft);color:var(--brand)}

/* Modules catalog table */
.cat-cell{vertical-align:top;background:#fcfcfb;white-space:nowrap}
.cat-chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:20px}
.tier-badge{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 9px;border-radius:20px;white-space:nowrap}
.agent-chips{display:flex;flex-wrap:wrap;gap:5px;max-width:420px}
.agent-chip{font-size:11.5px;font-weight:500;background:#071f16;color:#4ADEAB;padding:3px 9px;border-radius:6px;white-space:nowrap}

/* Categories */
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.cat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px}
.cat-card h3{font-size:15px;font-weight:600;margin-bottom:3px;display:flex;align-items:center;gap:8px}
.cat-card .cc-count{font-size:12.5px;color:var(--text-muted);margin-bottom:14px}
.cc-lab{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);margin:12px 0 6px}
.mods{display:flex;flex-wrap:wrap;gap:6px}
.mod{font-size:12px;background:var(--brand-soft);color:var(--brand);padding:4px 9px;border-radius:7px}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(20,19,26,.4);opacity:0;pointer-events:none;transition:opacity .18s;z-index:40}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:430px;max-width:92vw;background:var(--surface);box-shadow:-8px 0 30px rgba(0,0,0,.12);transform:translateX(100%);transition:transform .2s;z-index:50;display:flex;flex-direction:column}
.drawer.show{transform:translateX(0)}
.dr-head{padding:20px 22px;border-bottom:1px solid var(--border);position:relative}
.dr-close{position:absolute;top:16px;right:18px;border:none;background:none;color:var(--text-muted);font-size:22px;line-height:1}
.dr-body{padding:20px 22px;overflow-y:auto;flex:1}
.dr-name{font-size:18px;font-weight:600;margin-bottom:8px;padding-right:26px}
.dr-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 4px}
.dr-stat{background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:9px 10px;text-align:center}
.dr-stat b{display:block;font-size:17px;font-weight:600}
.dr-stat span{font-size:10.5px;color:var(--text-muted)}
.field{margin-bottom:14px}
.field .f-lab{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);margin-bottom:4px}
.field .f-val{font-size:14px}
.dr-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap}
.dr-foot .act{flex:1;justify-content:center;text-align:center;text-decoration:none}

/* Confirm modal (kept from original; restyled) */
#confirm{position:fixed;inset:0;background:rgba(20,19,26,.5);display:none;align-items:center;justify-content:center;padding:20px;z-index:60}
#confirm.open{display:flex}
.cbox{background:var(--surface);border-radius:14px;max-width:440px;width:100%;padding:24px;max-height:90vh;overflow-y:auto}
.ctitle{font-size:17px;font-weight:600;letter-spacing:-.2px;margin-bottom:10px}
.cbody{font-size:13.5px;color:var(--text-muted);line-height:1.6}
.cwarn{margin-top:12px;background:var(--amber-bg);border:1px solid #f2d79b;color:var(--amber);border-radius:10px;padding:9px 12px;font-size:12px;font-weight:500}
.cacts{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}

/* Toast + refresh hint */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:13.5px;opacity:0;pointer-events:none;transition:all .2s;z-index:70}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#refresh-hint{display:none;background:var(--blue-bg);border:1px solid #cfe0f7;color:var(--blue);border-radius:12px;padding:11px 15px;font-size:12.5px;margin-bottom:16px}

@media(max-width:900px){.sidebar{width:66px}.brand-name,.plane,.side-foot .who,.nav-item span:not(.badge){display:none}.nav-item{justify-content:center}.nav-item .badge{position:absolute;margin:0;transform:translate(12px,-12px)}.nav-item{position:relative}}
@media(max-width:640px){.search{width:150px}.dr-stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">G</div><div class="brand-name">Genoti</div></div>
    <div class="plane">Platform admin</div>
    <nav class="nav" id="nav">
      <button class="nav-item active" data-view="overview">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <span>Overview</span>
      </button>
      <button class="nav-item" data-view="merchants">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16l-1 13H5L4 7zM9 7V5a3 3 0 0 1 6 0v2"/></svg>
        <span>Merchants</span>
      </button>
      <button class="nav-item" data-view="approvals">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg>
        <span>Approvals</span> <span class="badge" id="nav-pending" style="display:none">0</span>
      </button>
      <button class="nav-item" data-view="finance">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/><path d="M6 15h4"/></svg>
        <span>Finance</span>
      </button>
      <button class="nav-item" data-view="plans">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l9 5-9 5-9-5 9-5zM3 12l9 5 9-5M3 17l9 5 9-5"/></svg>
        <span>Plans &amp; modules</span>
      </button>
      <button class="nav-item" data-view="analytics">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>
        <span>Analytics</span>
      </button>
      <button class="nav-item" data-view="categories">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16M4 12h16M4 19h16"/></svg>
        <span>Modules</span>
      </button>
    </nav>
    <div class="side-foot"><div class="avatar" id="side-avatar">–</div><div class="who">Admin<small id="side-email">Genoti admin</small></div></div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1 id="page-title">Overview</h1>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
        <input type="text" id="search" placeholder="Search merchants">
      </div>
      <div id="who-actions" style="display:none;gap:8px">
        <button class="top-btn" onclick="openSetPw()">Set password</button>
        <button class="top-btn danger" onclick="G.signOut().then(()=>location.reload())">Log out</button>
      </div>
    </div>

    <div class="wrap">
      <div id="gate" class="state"><h2>Checking access…</h2><p>One moment.</p></div>
      <div id="refresh-hint">Review opened in a new tab. Come back here and the list refreshes automatically.</div>

      <section class="view" id="view-overview" hidden></section>
      <section class="view" id="view-merchants" hidden></section>
      <section class="view" id="view-approvals" hidden></section>
      <section class="view" id="view-finance" hidden></section>
      <section class="view" id="view-plans" hidden></section>
      <section class="view" id="view-analytics" hidden></section>
      <section class="view" id="view-categories" hidden></section>
    </div>
  </main>
</div>

<div class="scrim" id="scrim" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer"><div id="drawer-content"></div></aside>
<div id="confirm" onclick="if(event.target===this)closeConfirm()"></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="auth.js"></script>
<script>
const G = window.GenotiAuth;
const sb = G.sb;

/* ── helpers ─────────────────────────────────────────────────────────── */
const $ = id => document.getElementById(id);
const fmt = n => Number(n || 0).toLocaleString('en-IN');
const inr = n => '₹' + fmt(n || 0);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const when = d => d ? new Date(d).toLocaleDateString('en-IN', { day:'numeric', month:'short' }) : '—';
const whenY = d => d ? new Date(d).toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' }) : '—';
const whenT = d => d ? new Date(d).toLocaleString('en-IN', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }) : '—';
const toast = m => { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2400); };

const kpi = (lab, val, sub, cls) =>
  `<div class="kpi ${cls || ''}"><div class="k-lab">${lab}</div><div class="k-val">${val}</div>${sub ? `<div class="k-sub">${sub}</div>` : ''}</div>`;
const card = (k, v, sub, cls) =>
  `<div class="card ${cls || ''}"><div class="k">${k}</div><div class="v">${v}</div>${sub ? `<div class="sub">${sub}</div>` : ''}</div>`;
const catTag = c => c ? `<span class="cat-tag cat-${esc(String(c).toLowerCase())}">${esc(c)}</span>` : '<span class="cat-tag">—</span>';
const SUB_STATUS_LABEL = { active:'Active', trial:'Trial', past_due:'Past due', cancelled:'Suspended', none:'No plan' };
const subStatusPill = st => `<span class="status s-${esc(st || 'none')}">${esc(SUB_STATUS_LABEL[st] || st || '—')}</span>`;

function barTable(rows, label, valLabel) {
  if (!rows.length) return `<div class="panel"><div class="empty">Nothing yet.</div></div>`;
  const max = Math.max(...rows.map(r => r[1]));
  return `<div class="panel"><div class="tw"><table><thead><tr><th>${label}</th><th class="num">${valLabel}</th><th style="width:34%"></th></tr></thead><tbody>
    ${rows.map(([k, v]) => `<tr><td>${esc(k)}</td><td class="num">${fmt(v)}</td>
      <td><div class="bar" style="width:${Math.round(v / max * 100)}%"></div></td></tr>`).join('')}
  </tbody></table></div></div>`;
}

/* ── access gate ─────────────────────────────────────────────────────── */
function showGate(title, body) {
  document.querySelectorAll('.view').forEach(v => v.hidden = true);
  const g = $('gate'); g.style.display = ''; g.innerHTML = `<h2>${title}</h2><p>${body}</p>`;
}
function hideGate() { $('gate').style.display = 'none'; go(VIEW); }

async function boot() {
  const user = await G.ready;
  if (!user) {
    showGate('Admin access', 'You need to log in with an admin account.' +
      '<br><br><a href="#" onclick="G.open({icon:\'lock\',title:\'Admin login\',msg:\'Log in with your admin account to open the dashboard.\'});return false">Log in</a>');
    G.onChange(u => { if (u) location.reload(); });
    return;
  }
  $('who-actions').style.display = 'flex';
  $('side-email').textContent = user.email;
  $('side-avatar').textContent = (user.email || '?').slice(0, 2).toUpperCase();

  const { data, error } = await sb.from('admins').select('email').limit(1);
  if (error || !data || !data.length) {
    showGate('Not an admin', `<b>${esc(user.email)}</b> is not on the admin list, so this dashboard is not available. ` +
      'If that is wrong, add the address to the <code>admins</code> table.');
    return;
  }
  loadData();
}

/* ── data ────────────────────────────────────────────────────────────── */
const FN_URL = 'https://ijsxmgkzwvamwctbkgjo.supabase.co/functions/v1/review-merchant-application';
const since = d => new Date(Date.now() - d * 864e5).toISOString();
let APPS = [];
let CP = null;
let VIEW = 'overview';
let D = {};                 // last loaded dataset, read by every view renderer
let flt = { cat:'all', status:'all', search:'' };

async function countOf(table, build) {
  let q = sb.from(table).select('*', { count:'exact', head:true });
  if (build) q = build(q);
  const { count, error } = await q;
  return error ? null : (count || 0);
}

async function loadData() {
  $('gate').style.display = 'none';
  if (!D.loaded) { const v = $('view-' + VIEW); v.hidden = false; v.innerHTML = `<div class="panel"><div class="empty">Loading…</div></div>`; }

  const [
    viewsAll, views1, views7, events30m, eventRows,
    deals, merchants, bookings, apps, cpResp, reqResp, logResp,
  ] = await Promise.all([
    countOf('events', q => q.eq('name', 'page_view')),
    countOf('events', q => q.eq('name', 'page_view').gte('created_at', since(1))),
    countOf('events', q => q.eq('name', 'page_view').gte('created_at', since(7))),
    sb.from('events').select('session_id').gte('created_at', new Date(Date.now() - 30 * 60000).toISOString()),
    sb.from('events').select('name, visitor_id, user_id, path, created_at').gte('created_at', since(30)).limit(5000),
    sb.from('deals').select('category, active, merchant_name'),
    sb.from('merchants').select('id, name, category, listed, created_at'),
    sb.from('bookings').select('id, merchant_name, status, customer_email, created_at'),
    sb.from('merchant_applications').select('id, full_name, business_name, category, email, phone, address, num_branches, num_staff, plan, status, approval_token, created_at, reviewed_at'),
    sb.functions.invoke('admin-metrics'),
    sb.from('upgrade_requests').select('id, merchant_id, current_plan_key, requested_plan_key, status, created_at').order('created_at', { ascending:false }),
    sb.from('plan_change_log').select('merchant_id, actor_email, from_plan, to_plan, from_status, to_status, changed_at').order('changed_at', { ascending:false }).limit(40),
  ]);

  const cp = (cpResp && !cpResp.error && cpResp.data && !cpResp.data.error) ? cpResp.data : null;
  CP = cp;
  let cpWhy = '';
  if (!cp) {
    if (cpResp && cpResp.data && cpResp.data.error) cpWhy = cpResp.data.error;
    else if (cpResp && cpResp.error) {
      cpWhy = cpResp.error.message || 'Function call failed';
      if (cpResp.error.context && typeof cpResp.error.context.json === 'function') {
        try { const b = await cpResp.error.context.json(); if (b && b.error) cpWhy = b.error; } catch (e) {}
      } else if (/Failed to send a request|Failed to fetch/i.test(cpWhy)) {
        cpWhy = 'The admin-metrics function is not deployed (or unreachable). Run: supabase functions deploy admin-metrics';
      }
    }
  }

  const evs = eventRows.data || [], dl = deals.data || [], mch = merchants.data || [];
  const bk = bookings.data || [], ap = apps.data || [];
  APPS = ap;
  const upReqs = (reqResp && reqResp.data) || [];
  const planLog = (logResp && logResp.data) || [];

  const nameById = {};
  mch.forEach(m => { nameById[m.id] = m.name; });
  if (cp && cp.merchants) cp.merchants.forEach(m => { if (!nameById[m.id]) nameById[m.id] = m.name; });
  const planName = k => { const p = (cp && cp.plans || []).find(x => x.key === k); return p ? p.name : (k || '—'); };

  const uniq = (arr, k) => new Set(arr.map(r => r[k]).filter(Boolean)).size;
  const group = (rows, key) => {
    const m = {};
    rows.forEach(r => { const k = r[key] || 'Uncategorised'; m[k] = (m[k] || 0) + 1; });
    return Object.entries(m).sort((a, b) => b[1] - a[1]);
  };

  D = {
    loaded:true, cp, cpWhy, mch, ap, dl, bk, evs, upReqs, planLog, nameById, planName,
    viewsAll, views1, views7,
    liveNow: uniq(events30m.data || [], 'session_id'),
    visitors30: uniq(evs, 'visitor_id'),
    signedIn30: uniq(evs, 'user_id'),
    bkToday: bk.filter(b => new Date(b.created_at) >= new Date(since(1))).length,
    bookers: uniq(bk, 'customer_email'),
    bkPending: bk.filter(b => b.status === 'pending').length,
    dealsByCat: group(dl.filter(d => d.active !== false), 'category'),
    mchByCat: group(mch, 'category'),
    bkByMerch: group(bk, 'merchant_name'),
    pagesByViews: group(evs.filter(e => e.name === 'page_view'), 'path'),
    missing: [deals, merchants, bookings, apps, eventRows].filter(r => r.error).map(r => r.error.message),
    notTracked: viewsAll === null,
    pendingApps: ap.filter(a => a.status === 'pending').length,
    pendingReqs: upReqs.filter(r => r.status === 'pending').length,
  };

  // approvals badge
  const badge = D.pendingApps + D.pendingReqs;
  const nb = $('nav-pending'); nb.textContent = badge; nb.style.display = badge ? '' : 'none';

  renderAll();
}
// existing action code calls render() to refresh — keep that working.
const render = loadData;

function cpNote(why) {
  return `<div class="note"><b>Control plane not connected yet.</b>
    Apply <code>supabase/migrations/20260726100000_control_plane.sql</code> and deploy the
    <code>admin-metrics</code> function to see plans, modules, usage and MRR.
    ${why ? `<br><br><b>Reason:</b> <code>${esc(why)}</code>` : ''}</div>`;
}

/* ── view: OVERVIEW ──────────────────────────────────────────────────── */
function renderOverview() {
  const cp = D.cp, k = (cp && cp.kpis) || {};
  const platform = cp ? `
    <h2 class="sec">Platform</h2>
    <div class="kpis">
      ${kpi('Merchants', fmt(k.merchants), `${fmt(k.active)} active · ${fmt(k.trialing)} trialing`)}
      ${kpi('Listed live', fmt(D.mch.filter(m => m.listed).length), 'visible to customers')}
      ${kpi('Pending approvals', fmt(D.pendingApps + D.pendingReqs), 'applications + upgrade requests')}
    </div>` : cpNote(D.cpWhy);

  const attn = (D.pendingApps || D.pendingReqs) ? `
    <div class="attn">
      <div class="a-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4m0 4h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg></div>
      <div class="a-txt">
        <div class="a-title">${D.pendingApps} application${D.pendingApps === 1 ? '' : 's'} &amp; ${D.pendingReqs} upgrade request${D.pendingReqs === 1 ? '' : 's'} waiting</div>
        <div class="a-sub">Review and action them in Approvals.</div>
      </div>
      <button class="act solid" onclick="go('approvals')">Go to approvals →</button>
    </div>` : '';

  const audience = `
    <h2 class="sec">Live activity</h2>
    <div class="kpis">
      ${kpi('Viewing now', `<span class="dot"></span>${fmt(D.liveNow)}`, 'active sessions, last 30 min')}
      ${kpi('Views today', fmt(D.views1), 'last 24 hours')}
      ${kpi('Unique visitors', fmt(D.visitors30), 'last 30 days')}
      ${kpi('Bookings today', fmt(D.bkToday), 'last 24 hours')}
    </div>`;

  // top merchants by bookings (from the control plane)
  let topMerch = '';
  if (cp && cp.merchants && cp.merchants.length) {
    const rows = cp.merchants.slice().sort((a, b) => b.usage.bookings - a.usage.bookings).slice(0, 5);
    topMerch = `
      <h2 class="sec">Most active merchants</h2>
      <div class="panel"><div class="tw"><table><thead><tr><th>Business</th><th>Category</th><th>Plan</th><th class="num">Bookings</th><th class="num">Clients</th></tr></thead><tbody>
        ${rows.map(m => `<tr class="rowlink" onclick="openDrawer('${esc(m.id)}')">
          <td class="m-name">${esc(m.name)}</td><td>${catTag(m.category)}</td>
          <td>${esc(m.plan_name || '—')}</td><td class="num">${fmt(m.usage.bookings)}</td><td class="num">${fmt(m.usage.clients)}</td>
        </tr>`).join('')}
      </tbody></table></div></div>`;
  }

  $('view-overview').innerHTML = attn + platform + audience + topMerch;
}

/* ── view: MERCHANTS ─────────────────────────────────────────────────── */
const ONBOARD_CATS = ['salon', 'spa', 'restaurant', 'cafe', 'gym', 'clinic', 'other'];
function genPw() {
  const chars = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = ''; for (let i = 0; i < 10; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return 'Gen-' + s;
}

function renderMerchants() {
  const cp = D.cp;
  const catOpts = ONBOARD_CATS.map(c => `<option value="${c}" ${c === 'salon' ? 'selected' : ''}>${c[0].toUpperCase() + c.slice(1)}</option>`).join('');
  const planOpts = ((cp && cp.plans) || []).slice().sort((a, b) => a.rank - b.rank)
    .map(p => `<option value="${esc(p.key)}" ${p.key === 'growth' ? 'selected' : ''}>${esc(p.name)}${p.price_monthly ? ` · ${inr(p.price_monthly)}/mo` : ''}</option>`).join('');
  const onboard = `
    <div class="card" style="margin-bottom:16px">
      <div class="k">Onboard a merchant</div>
      <div class="sub" style="margin:4px 0 12px">Create a merchant account with a password already set and provision its workspace instantly — they can log in straight away, no email link.</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px">
        <input id="ob-name"  class="inp" placeholder="Business name" autocomplete="off">
        <input id="ob-email" class="inp" type="email" placeholder="merchant@example.com" autocomplete="off">
        <input id="ob-pass"  class="inp" placeholder="Password (min 8)" value="${genPw()}" autocomplete="off">
        <select id="ob-cat"  class="inp">${catOpts}</select>
        <select id="ob-plan" class="inp">${planOpts || '<option value="growth">Business</option>'}</select>
      </div>
      <div style="display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap">
        <button class="act solid ok" id="ob-btn" onclick="onboardMerchant()">Onboard merchant</button>
        <span class="sub">Appears in the directory below once created.</span>
      </div>
      <div id="ob-msg" style="display:none;font-size:12.5px;margin-top:10px;padding:10px 12px;border-radius:9px"></div>
    </div>`;
  const tools = onboard + `
    <div class="tools">
      <div class="card">
        <div class="k">Approve a merchant account</div>
        <div class="sub" style="margin:4px 0 10px">Grants dashboard access to an existing merchant email (sets the approval flag). They log in again to pick it up.</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
          <input id="ap-email" type="email" placeholder="merchant@example.com" autocomplete="off" class="inp" style="flex:1;min-width:180px">
          <button class="act solid ok" id="ap-btn" onclick="approveMerchant()">Approve</button>
        </div>
        <div id="ap-msg" style="display:none;font-size:12.5px;margin-top:10px;padding:9px 12px;border-radius:9px"></div>
      </div>
      <div class="card">
        <div class="k">Salon / Spa Merchant OS</div>
        <div class="sub" style="margin:4px 0 10px">Open the full salon/spa module set (Services, Bookings, Staff, Clients, Loyalty, Inventory, Marketing…). Your admin account must be linked to a workspace to load it.</div>
        <a class="act solid" href="merchant/dashboard.html" target="_blank" rel="noopener" style="text-decoration:none;display:inline-block">Open the Merchant OS →</a>
      </div>
    </div>`;

  const stats = `<div class="kpis" style="margin-bottom:16px">
      ${kpi('Onboarded', fmt(D.mch.length), 'in the merchants table')}
      ${kpi('Listed live', fmt(D.mch.filter(m => m.listed).length), 'visible to customers')}
      ${kpi('With bookings', fmt(D.bkByMerch.length), 'taken at least one')}
    </div>`;

  if (!cp || !cp.merchants) {
    $('view-merchants').innerHTML = cpNote(D.cpWhy) + tools + stats;
    return;
  }

  const cats = ['all', ...Array.from(new Set(cp.merchants.map(m => m.category).filter(Boolean)))];
  const statuses = ['all', 'active', 'trial', 'past_due', 'cancelled'];
  const catSeg = `<div class="seg" id="cat-seg">${cats.map(c => `<button data-cat="${esc(c)}" class="${flt.cat === c ? 'on' : ''}">${c === 'all' ? 'All' : esc(c)}</button>`).join('')}</div>`;
  const stSeg = `<div class="seg" id="st-seg">${statuses.map(s => `<button data-st="${esc(s)}" class="${flt.status === s ? 'on' : ''}">${s === 'all' ? 'All' : (SUB_STATUS_LABEL[s] || s)}</button>`).join('')}</div>`;

  const q = flt.search.toLowerCase();
  const list = cp.merchants.filter(m => {
    if (flt.cat !== 'all' && m.category !== flt.cat) return false;
    if (flt.status !== 'all' && (m.status || 'none') !== flt.status) return false;
    if (q && !((m.name || '').toLowerCase().includes(q) || (m.category || '').toLowerCase().includes(q))) return false;
    return true;
  }).sort((a, b) => b.usage.bookings - a.usage.bookings);

  const rows = list.length ? list.map(m => `<tr class="rowlink" onclick="openDrawer('${esc(m.id)}')">
      <td><div class="m-name">${esc(m.name)}</div></td>
      <td>${catTag(m.category)}</td>
      <td>${esc(m.plan_name || '—')}${m.price_monthly ? `<div class="m-sub">${inr(m.price_monthly)}/mo</div>` : ''}</td>
      <td>${subStatusPill(m.status)}</td>
      <td class="num">${fmt(m.usage.bookings)}</td>
      <td class="num">${fmt(m.usage.clients)}</td>
      <td class="num">${fmt(m.usage.staff)}</td>
      <td class="num">${fmt(m.usage.services)}</td>
      <td>${when(m.last_active)}</td>
      <td onclick="event.stopPropagation()"><div class="row-actions">
        <button class="act ghost" onclick="openManage('${esc(m.id)}')">Manage</button>
        <a class="act ok" href="merchant/dashboard.html" target="_blank" rel="noopener">Open</a>
      </div></td>
    </tr>`).join('')
    : `<tr><td colspan="10"><div class="empty">No merchants match these filters.</div></td></tr>`;

  $('view-merchants').innerHTML = `
    ${tools}${stats}
    <div class="filters">
      <span class="filt-label">Category</span>${catSeg}
      <span class="filt-label" style="margin-left:6px">Status</span>${stSeg}
      <span class="spacer"></span>
      <span class="count-note">Showing ${list.length} of ${cp.merchants.length}</span>
    </div>
    <div class="panel"><div class="tw"><table><thead><tr>
      <th>Merchant</th><th>Category</th><th>Plan</th><th>Status</th>
      <th class="num">Bookings</th><th class="num">Clients</th><th class="num">Staff</th><th class="num">Services</th>
      <th>Last active</th><th></th>
    </tr></thead><tbody>${rows}</tbody></table></div></div>`;

  const cs = $('cat-seg'); if (cs) cs.addEventListener('click', e => { const b = e.target.closest('[data-cat]'); if (!b) return; flt.cat = b.dataset.cat; renderMerchants(); });
  const ss = $('st-seg'); if (ss) ss.addEventListener('click', e => { const b = e.target.closest('[data-st]'); if (!b) return; flt.status = b.dataset.st; renderMerchants(); });
}

/* ── view: APPROVALS ─────────────────────────────────────────────────── */
function applicantsTable(rows) {
  if (!rows.length) return `<div class="panel"><div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg><div>No applications yet.</div></div></div>`;
  const rank = { pending:0, approved:1, rejected:2 };
  const sorted = rows.slice().sort((a, b) => (rank[a.status] ?? 9) - (rank[b.status] ?? 9) || new Date(b.created_at) - new Date(a.created_at));
  return `<div class="panel"><div class="tw"><table><thead><tr>
      <th>Status</th><th>Business</th><th>Category</th><th>Contact</th><th>Email</th><th>Phone</th>
      <th class="num">Branches</th><th class="num">Staff</th><th>Plan</th><th>Requested</th><th>Review</th>
    </tr></thead><tbody>
    ${sorted.map(a => `<tr>
      <td><span class="status s-${esc(a.status)}">${esc(a.status)}</span></td>
      <td><b>${esc(a.business_name || '—')}</b>${a.address ? `<div class="m-sub">${esc(a.address)}</div>` : ''}</td>
      <td>${a.category ? catTag(a.category) : '—'}</td>
      <td>${esc(a.full_name || '—')}</td>
      <td><a href="mailto:${esc(a.email)}" style="color:var(--brand)">${esc(a.email || '—')}</a></td>
      <td>${esc(a.phone || '—')}</td>
      <td class="num">${esc(a.num_branches ?? '—')}</td>
      <td class="num">${esc(a.num_staff ?? '—')}</td>
      <td>${esc(a.plan || '—')}</td>
      <td>${esc(whenY(a.created_at))}</td>
      <td>${a.status === 'pending'
        ? `<div class="row-actions"><button class="act ok" onclick="askReview('${esc(a.id)}','approve')">Approve</button><button class="act no" onclick="askReview('${esc(a.id)}','reject')">Reject</button></div>`
        : `<span class="m-sub">${esc(whenY(a.reviewed_at))}</span>`}</td>
    </tr>`).join('')}
  </tbody></table></div></div>`;
}

function upgradeRequestsTable() {
  const pending = D.upReqs.filter(r => r.status === 'pending');
  if (!pending.length) return `<div class="panel"><div class="empty">No pending upgrade requests.</div></div>`;
  return `<div class="panel"><div class="tw"><table><thead><tr><th>Business</th><th>Requested</th><th>When</th><th></th></tr></thead><tbody>
    ${pending.map(r => `<tr>
      <td><b>${esc(D.nameById[r.merchant_id] || r.merchant_id)}</b></td>
      <td>${esc(D.planName(r.current_plan_key))} → <b>${esc(D.planName(r.requested_plan_key))}</b></td>

/* Edit a plan's price / name / tagline — writes to plans (admin RLS), which
   drives both MRR and the public pricing page. */
function openPlanEdit(key) {
  const p = (CP && CP.plans || []).find(x => x.key === key);
  if (!p) return;
  const fs = 'width:100%;margin:6px 0 14px;padding:10px 12px;border:1px solid var(--border-strong);border-radius:9px;font-size:14px;font-family:inherit;background:var(--white);color:var(--text);outline:none;box-sizing:border-box;';
  const ls = 'display:block;font-size:11.5px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em';
  $('confirm').innerHTML = `
    <div class="cbox">
      <div class="ctitle">Edit the ${esc(p.name)} plan</div>
      <div class="cbody">This price shows on the public pricing page and is used for MRR. Yearly is derived automatically at 20% off.</div>
      <div id="pe-msg" style="display:none;font-size:12.5px;margin-top:12px;padding:9px 12px;border-radius:9px"></div>
      <div style="margin-top:16px">
        <label style="${ls}">Plan name</label><input id="pe-name" value="${esc(p.name)}" style="${fs}">
        <label style="${ls}">Price (₹ / month) — 0 for a free tier</label><input id="pe-price" type="number" min="0" step="1" value="${p.price_monthly || 0}" style="${fs}">
        <label style="${ls}">Tagline (shown on the pricing card)</label><textarea id="pe-tagline" style="${fs};min-height:64px;resize:vertical">${esc(p.tagline || '')}</textarea>
      </div>
      <div class="cacts">
        <button class="act ghost" onclick="closeConfirm()">Cancel</button>
        <button class="act solid ok" id="pe-save" onclick="savePlan('${esc(key)}')">Save changes</button>
      </div>
    </div>`;
  $('confirm').classList.add('open');
  setTimeout(() => $('pe-name').focus(), 60);
}

async function savePlan(key) {
  const msg = $('pe-msg');
  const show = (t, ok) => { msg.textContent = t; msg.style.display = 'block';
    msg.style.background = ok ? 'var(--green-lt)' : 'var(--red-soft)'; msg.style.color = ok ? '#0a5c41' : '#a3271b'; };
  const name = $('pe-name').value.trim();
  const price = parseInt($('pe-price').value, 10);
  const tagline = $('pe-tagline').value.trim();
  if (!name) return show('Give the plan a name.', false);
  if (isNaN(price) || price < 0) return show('Enter a valid price (0 or more).', false);
  const btn = $('pe-save'); btn.disabled = true; btn.textContent = 'Saving…';
  const { error } = await sb.from('plans').update({ name, price_monthly: price, tagline }).eq('key', key);
  btn.disabled = false; btn.textContent = 'Save changes';
  if (error) return show(error.message || 'Could not save. Check you are on the admins list.', false);
  show('Saved. Updating…', true); toast('Plan updated');
  setTimeout(() => { closeConfirm(); loadData(); }, 700);
}

/* Set the lowest plan tier a module unlocks from (writes modules.min_plan_rank). */
async function setModuleTier(key, rank) {
  const { error } = await sb.from('modules').update({ min_plan_rank: rank }).eq('key', key);
  if (error) { toast('Could not update: ' + (error.message || 'error')); return; }
  toast('Module tier updated'); loadData();
}

/* ── view: FINANCE ───────────────────────────────────────────────────── */
function renderFinance() {
  const cp = D.cp;
  if (!cp) { $('view-finance').innerHTML = cpNote(D.cpWhy); return; }
  const k = cp.kpis || {}, M = cp.merchants || [];
  const plans = (cp.plans || []).slice().sort((a, b) => a.rank - b.rank);
  const mrr = k.mrr || 0;
  const sumPrice = arr => arr.reduce((s, m) => s + (m.price_monthly || 0), 0);
  const paying   = M.filter(m => m.status === 'active' && (m.price_monthly || 0) > 0).length;
  const trials   = M.filter(m => m.status === 'trial');
  const atRisk   = M.filter(m => m.status === 'past_due' || m.status === 'cancelled');
  const trialMRR = sumPrice(trials), atRiskMRR = sumPrice(atRisk);

  const revenue = `
    <h2 class="sec">Recurring revenue</h2>
    <div class="kpis">
      ${kpi('MRR', inr(mrr), 'active subscriptions', 'brandval')}
      ${kpi('ARR (run-rate)', inr(mrr * 12), 'MRR × 12')}
      ${kpi('Avg revenue / merchant', inr(k.active ? Math.round(mrr / k.active) : 0), 'active only')}
      ${kpi('Paying subscriptions', fmt(paying), `${fmt(k.active)} active · ${fmt(k.trialing)} trialing`)}
    </div>`;

  const flow = `
    <h2 class="sec">Pipeline &amp; risk</h2>
    <div class="kpis">
      ${kpi('Trial pipeline', inr(trialMRR), `${fmt(trials.length)} on trial · potential MRR`)}
      ${kpi('MRR at risk', inr(atRiskMRR), `${fmt(atRisk.length)} past due / suspended`, atRiskMRR ? 'hot' : '')}
    </div>`;

  const rows = plans.map(p => {
    const act = M.filter(m => m.status === 'active' && m.plan_key === p.key).length;
    const contrib = act * (p.price_monthly || 0);
    return { p, act, contrib, pct: mrr ? Math.round(contrib / mrr * 100) : 0 };
  });
  const byPlan = `
    <h2 class="sec">Revenue by plan</h2>
    <div class="panel"><div class="tw"><table><thead><tr><th>Plan</th><th class="num">Price</th><th class="num">Active</th><th class="num">MRR</th><th style="width:26%"></th><th class="num">Share</th></tr></thead><tbody>
      ${rows.map(r => `<tr>
        <td><b>${esc(r.p.name)}</b></td>
        <td class="num">${r.p.price_monthly ? inr(r.p.price_monthly) : 'Free'}</td>
        <td class="num">${fmt(r.act)}</td>
        <td class="num">${inr(r.contrib)}</td>
        <td><div class="bar" style="width:${r.pct}%"></div></td>
        <td class="num">${r.pct}%</td>
      </tr>`).join('')}
    </tbody></table></div></div>`;

  const order = [['active','Active'], ['trial','Trial'], ['past_due','Past due'], ['cancelled','Suspended'], ['none','No plan']];
  const health = `
    <h2 class="sec">Subscription health</h2>
    <div class="panel"><div class="tw"><table><thead><tr><th>Status</th><th class="num">Merchants</th><th class="num">Monthly value</th></tr></thead><tbody>
      ${order.map(([st, lab]) => {
        const ms = M.filter(m => (m.status || 'none') === st);
        if (!ms.length) return '';
        return `<tr><td>${subStatusPill(st)}</td><td class="num">${fmt(ms.length)}</td><td class="num">${inr(sumPrice(ms))}</td></tr>`;
      }).join('') || '<tr><td colspan="3"><div class="empty">No subscriptions yet.</div></td></tr>'}
    </tbody></table></div></div>`;

  const chg = (a, b) => (a && a !== b) ? `${esc(a)} → <b>${esc(b)}</b>` : `<b>${esc(b || '—')}</b>`;
  const logRows = D.planLog.map(l => `<tr>
      <td>${whenT(l.changed_at)}</td>
      <td>${esc(D.nameById[l.merchant_id] || l.merchant_id)}</td>
      <td>${chg(D.planName(l.from_plan), D.planName(l.to_plan))}</td>
      <td>${chg(l.from_status, l.to_status)}</td>
      <td class="m-sub">${esc(l.actor_email || 'system')}</td>
    </tr>`).join('');
  const log = `
    <h2 class="sec">Plan change log</h2>
    ${D.planLog.length ? `<div class="panel"><div class="tw"><table><thead><tr><th>When</th><th>Business</th><th>Plan</th><th>Status</th><th>By</th></tr></thead><tbody>${logRows}</tbody></table></div></div>`
      : '<div class="panel"><div class="empty">No plan changes recorded yet.</div></div>'}`;

  $('view-finance').innerHTML = revenue + flow + byPlan + health + log;
}

  $('drawer').classList.add('show'); $('scrim').classList.add('show');
}
function closeDrawer() { $('drawer').classList.remove('show'); $('scrim').classList.remove('show'); }

/* ── control actions: manage plan / status ───────────────────────────── */
const STATUSES = [['active','Active'], ['trial','Trial'], ['past_due','Past due'], ['cancelled','Suspended']];

function openManage(id, presetPlanKey, requestId) {
  const m = (CP && CP.merchants || []).find(x => String(x.id) === String(id));
  if (!m) return;
  closeDrawer();
  const plans = ((CP && CP.plans) || []).slice().sort((a, b) => a.rank - b.rank);
  const wantPlan = presetPlanKey || m.plan_key;
  const planOpts = plans.map(p => `<option value="${esc(p.key)}" ${p.key === wantPlan ? 'selected' : ''}>${esc(p.name)} · ${p.price_monthly ? inr(p.price_monthly) + '/mo' : 'Free'}</option>`).join('');
  const statusOpts = STATUSES.map(([v, label]) => `<option value="${v}" ${v === m.status ? 'selected' : ''}>${label}</option>`).join('');
  const fieldStyle = 'width:100%;margin-top:6px;padding:10px 12px;border:1px solid var(--border-strong);border-radius:9px;font-size:14px;font-family:inherit;background:var(--white);outline:none;box-sizing:border-box;';
  $('confirm').innerHTML = `
    <div class="cbox">
      <div class="ctitle">Manage ${esc(m.name)}</div>
      <div class="cbody">Set this merchant's plan and subscription status. Takes effect immediately — <b>Suspended</b> removes them from MRR.</div>
      <div id="mng-msg" style="display:none;font-size:12.5px;margin-top:12px;padding:9px 12px;border-radius:9px"></div>
      <div style="margin-top:16px"><label class="k" style="display:block;font-size:11.5px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em">Plan</label>
        <select id="mng-plan" style="${fieldStyle}">${planOpts || '<option>No plans found</option>'}</select></div>
      <div style="margin-top:14px"><label class="k" style="display:block;font-size:11.5px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em">Status</label>
        <select id="mng-status" style="${fieldStyle}">${statusOpts}</select></div>
      <div class="cacts">
        <button class="act ghost" onclick="closeConfirm()">Cancel</button>
        <button class="act solid ok" id="mng-save" onclick="saveManage('${esc(m.id)}', ${requestId ? `'${esc(requestId)}'` : 'null'})">Save changes</button>
      </div>
    </div>`;
  $('confirm').classList.add('open');
}

async function saveManage(id, requestId) {
  const msg = $('mng-msg');
  const show = (text, ok) => { msg.textContent = text; msg.style.display = 'block';
    msg.style.background = ok ? 'var(--green-lt)' : 'var(--red-soft)'; msg.style.color = ok ? '#0a5c41' : '#a3271b'; };
  const plan_key = $('mng-plan').value, status = $('mng-status').value;
  if (!plan_key) return show('Pick a plan first.', false);
  const btn = $('mng-save'); btn.disabled = true; btn.textContent = 'Saving…';
  const { error } = await sb.from('merchant_subscriptions').upsert(
    { merchant_id:id, plan_key, status, updated_at:new Date().toISOString() }, { onConflict:'merchant_id' });
  if (error) { btn.disabled = false; btn.textContent = 'Save changes'; return show(error.message || 'Could not save. Check you are on the admins list.', false); }
  if (requestId && requestId !== 'null') {
    await sb.from('upgrade_requests').update({ status:'actioned', actioned_at:new Date().toISOString(), actioned_by:(G.user() && G.user().email) || null }).eq('id', requestId);
  }
  btn.disabled = false; btn.textContent = 'Save changes';
  show('Saved. Refreshing…', true);
  toast('Plan updated');
  setTimeout(() => { closeConfirm(); loadData(); }, 700);
}

async function actionRequest(id, status) {
  const { error } = await sb.from('upgrade_requests').update({ status, actioned_at:new Date().toISOString(), actioned_by:(G.user() && G.user().email) || null }).eq('id', id);
  if (!error) { toast('Request ' + status); loadData(); }
}

/* ── approve a merchant by email (edge function) ─────────────────────── */
async function approveMerchant() {
  const email = ($('ap-email').value || '').trim();
  const btn = $('ap-btn'), msg = $('ap-msg');
  const show = (text, ok) => { msg.textContent = text; msg.style.display = 'block';
    msg.style.background = ok ? 'var(--green-lt)' : 'var(--red-soft)'; msg.style.color = ok ? '#0a5c41' : '#a3271b'; };
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return show('Enter a valid merchant email.', false);
  btn.disabled = true; btn.textContent = 'Approving…';
  const { data, error } = await sb.functions.invoke('approve-merchant', { body:{ email } });
  btn.disabled = false; btn.textContent = 'Approve';
  if (error || (data && data.error)) {
    let m = (data && data.error) || (error && error.message) || 'Could not approve.';
    if (error && error.context && typeof error.context.json === 'function') { try { const b = await error.context.json(); if (b && b.error) m = b.error; } catch (e) {} }
    return show(m, false);
  }
  show(`Approved ${email}. Ask them to log out and back in.`, true);
  $('ap-email').value = '';
}

/* Onboard a merchant end-to-end via the admin-onboard-merchant function
   (create account + password + workspace + subscription). The function
   authorises this caller through the admin JWT that supabase-js attaches. */
async function onboardMerchant() {
  const name = ($('ob-name').value || '').trim();
  const email = ($('ob-email').value || '').trim();
  const pass = $('ob-pass').value || '';
  const category = $('ob-cat').value, plan_key = $('ob-plan').value;
  const btn = $('ob-btn'), msg = $('ob-msg');
  const show = (t, ok) => { msg.innerHTML = t; msg.style.display = 'block';
    msg.style.background = ok ? 'var(--green-lt)' : 'var(--red-soft)'; msg.style.color = ok ? '#0a5c41' : '#a3271b'; };
  if (!name) return show('Enter a business name.', false);
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return show('Enter a valid email.', false);
  if (pass.length < 8) return show('Password must be at least 8 characters.', false);

  btn.disabled = true; btn.textContent = 'Onboarding…';
  const { data, error } = await sb.functions.invoke('admin-onboard-merchant',
    { body: { email, password: pass, business_name: name, category, plan_key } });
  btn.disabled = false; btn.textContent = 'Onboard merchant';
  if (error || (data && data.error)) {
    let m = (data && data.error) || (error && error.message) || 'Could not onboard.';
    if (error && error.context && typeof error.context.json === 'function') { try { const b = await error.context.json(); if (b && b.error) m = b.error; } catch (e) {} }
    return show(esc(m), false);
  }
  toast('Merchant onboarded');
  onboardSuccessModal(name, email, pass);
  loadData();   // refresh directory + metrics behind the modal
}

function onboardSuccessModal(name, email, pass) {
  $('confirm').innerHTML = `
    <div class="cbox">
      <div class="ctitle">✓ ${esc(name)} onboarded</div>
      <div class="cbody">The account is live and can log in now. Share these credentials with the merchant:</div>
      <div style="margin-top:14px;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:13.5px;line-height:2">
        <div>Login &nbsp;<b>www.genoti.ai/merchant</b></div>
        <div>Email &nbsp;<b>${esc(email)}</b></div>
        <div>Password &nbsp;<b>${esc(pass)}</b></div>
      </div>
      <div class="cwarn">Ask them to change the password after first login.</div>
      <div class="cacts"><button class="act solid ok" onclick="closeConfirm()">Done</button></div>
    </div>`;
  $('confirm').classList.add('open');
}

/* ── review an application (approve/reject via emailed function page) ── */
function reviewUrl(a, action) { return `${FN_URL}?id=${encodeURIComponent(a.id)}&token=${encodeURIComponent(a.approval_token || '')}&action=${action}`; }
function askReview(id, action) {
  const a = APPS.find(x => String(x.id) === String(id));
  if (!a) return;
  const approve = action === 'approve';
  $('confirm').innerHTML = `
    <div class="cbox">
      <div class="ctitle">${approve ? 'Approve' : 'Reject'} ${esc(a.business_name)}?</div>
      <div class="cbody">${approve
        ? `This creates an account for <b>${esc(a.email)}</b> and emails them a link to set a password. They get access to the merchant dashboard straight away.`
        : `This marks the request rejected and no account is created. <b>${esc(a.email)}</b> is not emailed, so follow up yourself if you want to.`}
        <div class="cwarn">This cannot be undone from this panel.</div></div>
      <div class="cacts"><button class="act ghost" onclick="closeConfirm()">Cancel</button>
        <button class="act solid ${approve ? 'ok' : 'no'}" onclick="doReview('${esc(a.id)}','${action}')">${approve ? 'Approve and create account' : 'Reject request'}</button></div>
    </div>`;
  $('confirm').classList.add('open');
}
function doReview(id, action) {
  const a = APPS.find(x => String(x.id) === String(id));
  closeConfirm();
  if (!a) return;
  window.open(reviewUrl(a, action), '_blank', 'noopener');
  $('refresh-hint').style.display = '';
}
function closeConfirm() { $('confirm').classList.remove('open'); }

/* ── set / change admin password ─────────────────────────────────────── */
function openSetPw() {
  const fieldStyle = 'width:100%;margin-top:10px;padding:11px 13px;border:1px solid var(--border-strong);border-radius:9px;font-size:14px;font-family:inherit;outline:none;box-sizing:border-box;';
  $('confirm').innerHTML = `
    <div class="cbox">
      <div class="ctitle">Set a password</div>
      <div class="cbody">Choose a password so you can sign in with email + password next time, instead of a one-time code.</div>
      <div id="pw-msg" style="display:none;font-size:12.5px;margin-top:12px;padding:9px 12px;border-radius:9px"></div>
      <input id="admin-pw" type="password" placeholder="New password (min 8)" autocomplete="new-password" style="${fieldStyle}">
      <input id="admin-pw2" type="password" placeholder="Confirm password" autocomplete="new-password" style="${fieldStyle}">
      <div class="cacts"><button class="act ghost" onclick="closeConfirm()">Cancel</button>
        <button class="act solid ok" id="admin-pw-save" onclick="saveAdminPw()">Save password</button></div>
    </div>`;
  $('confirm').classList.add('open');
  setTimeout(() => $('admin-pw').focus(), 60);
}
async function saveAdminPw() {
  const pw = $('admin-pw').value, pw2 = $('admin-pw2').value, msg = $('pw-msg');
  const show = (text, ok) => { msg.textContent = text; msg.style.display = 'block';
    msg.style.background = ok ? 'var(--green-lt)' : 'var(--red-soft)'; msg.style.color = ok ? '#0a5c41' : '#a3271b'; };
  if (pw.length < 8) return show('Password must be at least 8 characters.', false);
  if (pw !== pw2) return show('Passwords do not match.', false);
  const btn = $('admin-pw-save'); btn.disabled = true; btn.textContent = 'Saving…';
  const { error } = await sb.auth.updateUser({ password: pw });
  btn.disabled = false; btn.textContent = 'Save password';
  if (error) return show(error.message || 'Could not set the password.', false);
  try {
    const email = (G.user() && G.user().email) || '';
    const list = JSON.parse(localStorage.getItem('genoti_pw_emails') || '[]');
    if (email && !list.includes(email)) { list.push(email); localStorage.setItem('genoti_pw_emails', JSON.stringify(list)); }
    if (email) localStorage.setItem('genoti_last_email', email);
  } catch (e) {}
  show('Password set. You can now sign in with your email and this password.', true);
  setTimeout(closeConfirm, 1600);
}

/* Coming back from a review tab, pull fresh statuses. */
window.addEventListener('focus', () => {
  const hint = $('refresh-hint');
  if (hint && hint.style.display !== 'none') { hint.style.display = 'none'; loadData(); }
});

boot();
</script>
